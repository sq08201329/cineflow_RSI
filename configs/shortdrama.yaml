# 形态配置：短剧（shortdrama）
# 形态即配置：**形态差异全部在此表达**——评估器权重与阈值、节奏基准曲线（前段权重上调）、
# 外环频率（日级）、预算与并行度（下调）、时长与规格（竖屏、1~3 分钟）。
# 切换形态零代码改动：同一套执行链读本文件即可跑短剧（宪章原则五；
# 静态断言见 tests/unit/test_form_switch.py —— core/ 与 agents/ 无形态分支）。
form: shortdrama
# 该形态的**其余名称**（英文同义词 + 中文别名）：与 `form` 一起构成静态守卫的「名称面」
# （`ops/form_guard.py` 的 `form_literals`，由配置派生、零人工常量）。**缺键即报错**：
# 允许显式空列表 `[]`（本形态暂无别名），但不得省略——省略会让新形态名静默逃逸。
form_aliases: []

evaluator_weights:
  visual:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0（竖屏规格对照 clip_spec）
    rule.format_compliance: gate
    proxy.aesthetic: 0.3 # 短剧画面即封面，美学权重上调
    proxy.identity_consistency: 0.3 # 主角辨识度要求高（竖屏特写多）
    proxy.flicker: 0.1
    judge.cinematic: 0.3
  promo:
    rule.material_compliance: gate
    proxy.ctr_history: 0.5 # 短剧更依赖历史点击率（投放节奏密集）
    human.platform_metrics: 0.5
  sound:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0
    rule.loudness_compliance: gate # 响度合规分档（sound.loudness 对照）
    rule.av_sync: gate # 事件时间偏差 ≤ sound.av_sync_threshold_ms
    proxy.asr_transcript: 0.6 # 短剧以对白承载剧情，台词准确度权重上调
    proxy.emotion_music_match: 0.4
  editing:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0；gate 短路不跑 judge（省 LLM 成本）
    rule.duration_compliance: gate # 总时长 ∈ target ± tolerance
    rule.shot_distribution: gate # 镜头时长 ∈ editing.shot_limits
    rule.transition_rules: gate # 转场规则库（与执行前校验同一配置库）
    proxy.pacing_curve: 0.7 # 短剧留存靠节奏，节奏权重上调
    judge.narrative_flow: 0.3
  storyboard:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0；gate 短路不跑 judge（省 LLM 成本）
    rule.shot_grammar: gate # 景别切换合理性规则库（与执行前校验同一规则库）
    rule.coverage: gate # 场景级（每场景 ≥1 镜）+ 必覆盖清单（key 行逐条承接）
    rule.axis_rule: gate # 轴规则：机位侧别跳变需过渡镜头（180° 线）
    proxy.emotion_alignment: 0.6 # 短剧镜头少，每一镜都须贴情绪
    judge.script_fit: 0.4
  screenplay:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0；gate 短路不跑 judge（省 LLM 成本）
    rule.beat_structure: gate # 节拍表 + 关键节拍存在性（短剧节拍表配置驱动）
    rule.page_minutes: gate # 页数（lines_per_page 换算）∈ 目标时长 ± 容差
    rule.scene_character: gate # 场景-角色一致性（无幽灵角色/地点一致）
    rule.dialogue_action_ratio: gate # 对白行占比 ∈ 配置区间（短剧对白密集，区间上调）
    proxy.entity_consistency: 0.4
    proxy.timeline_conflict: 0.6 # 短剧时间跨度小，时序冲突权重上调
    judge.dramatic_tension: 0.5 # 仅 outline 阶段适用；scenes/script 阶段"不适用"跳过
  dev:
    # 开发（选题 / IP 评估 / 立项组合）功能 017：短剧更依赖当下热度，回归分量下调
    rule.slate_structure: gate # 立项组合工件结构完整性
    rule.slate_combination: gate # 组合层：方向多样性/去重率、条目上限、进入生产标记
    proxy.genre_regression: 0.4 # 历史同类型票房回归预测（模拟数据源，确定性）
    proxy.buzz_heat: 0.6 # 舆情检索热度（模拟数据源，确定性）


# 回放形态参数（功能 002）：worker_count 为虚拟时钟并行工作者数 W；
# latency_quantum_ms 为响应时间填充的时延量子（计时侧信道防护）；
# unbiasedness_tau_threshold 为回放无偏性 Kendall τ 发布门槛。
# 短剧差异：**并行度下调**——回放与编排都收敛到单线（预算与机器占用同步下调）
replay:
  worker_count: 1
  latency_quantum_ms: 50
  validation_split: latest_tree
  unbiasedness_tau_threshold: 0.95
  # 跨项目池化（功能 011）：分组/阈值/跨形态/做梦开关全配置化（原则五）；
  # min_trees 为前置条件（同 Agent 同形态树 ≥ N 棵，不足即拒绝并注明，FR-002）；
  # allow_cross_form 默认关闭——跨形态合并需显式开启（短剧树与电影树不混池）
  pooling:
    min_trees: 2 # 短剧树量小，前置门槛相应下调
    dilution_hit_ratio_threshold: 0.7
    allow_cross_form: false
    enabled_for_dreaming: false
    pools_dir: replay/pools

# 宣发（promo）形态参数：预算门禁、物料规格、敏感词库、模型价目表、模拟平台分布
# 短剧差异：预算下调、单轮物料数下调、竖屏短视频物料规格（时长更短、文案更短）
promo:
  exploration_per_round_usd: 120 # 单轮总预算（投放上限 = 本值 × promo_pilot_ratio）
  promo_pilot_ratio: 0.02 # 单轮 ≤ 总预算 2%（预算门禁，FR-002）
  # 归属日**必填口径生效日**（功能 020）：该日及之后的真实采集写入路径缺归属日 ⇒ 显式失败、
  # 该条不落锚点；`created_at` 的日期早于该日的历史行允许按日期回退（如实登记计数）。
  # 两形态 schema 齐备（缺键即报错，不取码内默认）。
  attribution_date_required_since: 2026-09-25
  default_model: mock-copy-v1
  materials_per_round: 2
  material_spec:
    max_copy_chars: 80 # 竖屏信息流文案更短（仍短于电影 120，且容纳模拟生成文案长度）
    poster_size: "1080x1920" # 竖屏封面
    max_duration_seconds: 20
  sensitive_words: ["最", "第一", "国家级"] # 示例敏感词库；缺配置即拒投不放行
  ctr_prior: {alpha: 2.0, beta: 40.0} # 分桶贝塔平滑先验强度
  ctr_cap: 0.2 # CTR 归一化上限（score = min(1, ctr / cap)）
  metric_weights: {ctr: 0.4, completion_rate: 0.4, conversions: 0.2} # 完播率权重上调
  model_prices: # 模型价目表（美元/千 token）；缺价目即报错，不允许静默零成本
    mock-copy-v1: {prompt_per_1k: 0.001, completion_per_1k: 0.002}
    # DeepSeek 真实 LLM（OpenAI 兼容，base = https://api.deepseek.com）——冒烟用；
    # 口径：按**峰时（UTC 周一至周五 01:00-04:00 / 06:00-10:00）缓存未命中**上限折算，
    # 保守高估（真实账单因缓存命中与错峰计价只会更低，见 docs/二期升级路径-真实生成与投放.md）；
    # 价目/模型名变动由运维按官方价目与命名更新（旧名 deepseek-chat 等已退役）。
    # flash：输入 $0.3/1M → 0.0003/1k；输出 $1.2/1M → 0.0012/1k
    deepseek-flash: {prompt_per_1k: 0.0003, completion_per_1k: 0.0012}
    # pro：输入 $1.32/1M → 0.00132/1k；输出 $3.96/1M → 0.00396/1k
    deepseek-v4-pro: {prompt_per_1k: 0.00132, completion_per_1k: 0.00396}
  simulated_platform: # 模拟平台分布参数（Beta 先验）
    base_impressions: 1000
    ctr_beta: [2.0, 40.0]
    completion_beta: [3.0, 7.0]

# 视觉（visual）形态参数：片段规格、生成预算、帧采样规则、judge 锚点集与提示词
# 短剧差异：预算下调、单轮片段数下调、**竖屏片段规格**（竖屏短视频）
# ⚠️ 接线口径：生成参数须由本段的 clip_spec 派生 width/height（模拟生成器在
# gen_params 缺省时回落 320x240），否则 rule.format_compliance 门禁会将片段判 0。
visual:
  exploration_per_round_usd: 60 # 单轮生成预算上限（FR-003，预算门禁）
  clips_per_round: 2
  clip_spec: # 片段规格（rule.format_compliance 对照）
    # 试水档：竖屏 9:16 预览分辨率/帧率（生产档为 1080x1920@30fps，装配层替换即可）
    width: 144 # 9:16 且可被 16 整除（避免 ffmpeg 改尺寸撞合规门禁）
    height: 256 # 竖屏 9:16
    fps: 8
    duration_seconds: 7.5 # 单镜时长（镜头数 = 成片目标时长 / 本值）
    codec: h264
  frame_sampling: # 帧采样规则（进评估器版本元信息，决策 3）
    count: 8
    size: 64
  simulated_gen: # 确定性模拟生成器参数（决策 2）
    frames: 60 # 帧数 = duration_seconds × fps（片段时长与规格自洽）
    fps: 8 # 编码帧率（模拟生成器读本项；须与 clip_spec.fps 一致，否则合规门禁判 0）
    estimated_cost_usd: 0.25 # 预估花费（实际扣费 ≤ 预估）
    cost_per_clip_usd: 0.2 # 实际扣费（短剧单片段单价下调）
  judge: # judge.cinematic 委员会（决策 5）：锚点=固定生成参数集经模拟生成器产出
    anchor_gen_params:
      - {style: "史诗", shots: 2, seed_tier: 1}
      - {style: "纪实", shots: 1, seed_tier: 2}
    prompts:
      - "哪一段镜头的电影感更强？"
      - "哪一段的叙事张力更好？"
      - "哪一段的画面构图更专业？"
    # judge 单票输出预算（缺即报错，不允许静默取码内默认）：判决输出只需一票（A/B/平局），
    # 512 足够；判决档为非思考模式（thinking=disabled），预算不会被思维链吃光
    max_tokens: 512

# 声音（sound）形态参数：生成预算、响度分档、同步阈值、采样率、
# 三类型价目表（成本分账粒度）、确定性模拟生成参数（声学属性注入）
# 短剧差异：预算下调、单轮参数组数下调、口型同步阈值收紧（特写多，偏差更显眼）、
# 单价下调（体量小、单条时长短）
sound:
  exploration_per_round_usd: 40 # 单轮生成预算上限（预算门禁，按 gen_type 分账）
  clips_per_round: 3 # 单轮参数组数（短剧对白为主：2 TTS + 1 music）
  loudness: # 响度合规分档（rule.loudness_compliance 对照，单位 LUFS）
    dialogue: {target_lufs: -27.0, tolerance: 2.0}
    sfx: {target_lufs: -30.0, tolerance: 3.0}
    music: {target_lufs: -25.0, tolerance: 3.0}
  av_sync_threshold_ms: 100 # 事件时间偏差 gate 阈值（比电影更严：竖屏特写多）
  sample_rate: 16000 # 模拟生成与评估的统一采样率（单声道 PCM16）
  prices: # 三类型价目表；缺价目即报错，不允许静默零成本（003 同款纪律）
    tts: {per_second_usd: 0.02}
    sfx: {per_event_usd: 0.05}
    music: {per_second_usd: 0.03}
  simulated_gen: # 确定性模拟生成器参数（声学属性注入响度/事件时间/错字率/情绪向量）
    base_freq_hz: 240.0 # 短剧以对白为主，基频略高
    harmonics: 4
    duration_seconds: 1.5 # 默认时长（gen_params 可覆盖）
    estimated_cost_usd: 0.2 # 预估花费（实际扣费 ≤ 预估）
    cost_per_clip_usd: 0.15
  asr: # proxy.asr_transcript 口径（决策 4：确定性代理，实现哈希即版本）
    cer_cap: 0.2 # CER 归一化上限（score = 1 − min(1, CER / cer_cap)）
  emotion: # proxy.emotion_music_match 口径（决策 9：余弦距离映射）
    calibration_band: 0.5 # 校准带：余弦距离超带 → diagnostics 标低置信

# 剪辑（editing）形态参数：探索预算、时长容差、镜头限制、转场规则库（执行前校验与
# 门禁共用单一事实源）、节奏基准曲线（分段统计 + 段权重）、渲染价目与编码参数、
# judge 提示词与锚点 EDL 集
# 短剧差异（本形态核心）：**节奏基准曲线前段权重上调**（前 10% 决定留存）、
# 分段更细更快、镜头更短、**竖屏渲染规格**、预算下调
editing:
  exploration_per_round_usd: 50 # 单轮剪辑探索预算上限（按成片时长计价）
  edits_per_round: 2
  target_duration_s: 120 # 成片目标时长（1~3 分钟档的中位：2 分钟）
  duration_tolerance_s: 15 # 时长容差：总时长 ∈ [105, 135]s 过 gate
  shot_limits: # 镜头时长限制（rule.shot_distribution 对照）
    min_shot_ms: 300 # 短剧敢用更短的镜头
    max_shot_ms: 12000 # 长镜头上限压缩（留存优先）
  transition_rules: # 转场规则库：EDL 执行前校验第④层与 rule.transition_rules 共用
    allowed: [cut, dissolve, fade]
    dissolve_max_ms: 1200 # 叠化时长上限（短剧更短）
    forbid_jump_cut_within_scene: true # 同区连续镜头禁跳切（须叠化/淡入淡出）
  pacing_baseline: # 节奏基准 = 分段目标统计 + 段权重（缺基准即报错）
    d_cap: 400000.0 # 加权欧氏距离归一化上限（短剧体量小，量纲随之下降）
    segments: # 前段权重上调：前 10% 留存权重最高，结尾留钩子
      - {span: [0.0, 0.1], mean_ms: 700, var_ms: 60000, weight: 3.0}
      - {span: [0.1, 0.5], mean_ms: 1500, var_ms: 250000, weight: 1.5}
      - {span: [0.5, 0.85], mean_ms: 2500, var_ms: 500000, weight: 1.0}
      - {span: [0.85, 1.0], mean_ms: 1200, var_ms: 150000, weight: 2.0}
  render: # 渲染合成参数（编码单线程确定性档，消除 004 x264 多线程 flake 根因）
    fps: 8
    width: 144 # 9:16 且可被 16 整除（避免 ffmpeg 改尺寸撞合规门禁）
    height: 256 # 竖屏 9:16 成片（试水档；生产档 1080x1920@30fps 走装配层替换）
    codec: libx264
    encode_threads: 1 # 固定单线程档：同 EDL 两次渲染逐字节一致（SC-001）
    price_per_second_usd: 0.02 # 成片时长计价；缺价目即报错（原则三）
  judge: # judge.narrative_flow 委员会（决策 5）：版本号 = 提示词 + 锚点集 + 摘要函数 + 输出预算四段哈希
    prompts:
      - "哪一版剪辑的叙事更连贯？"
      - "哪一版的情绪推进更好？"
      - "哪一版的节奏更贴合短剧形态？"
    # judge 单票输出预算（缺即报错，不允许静默取码内默认）：判决输出只需一票（A/B/平局），
    # 512 足够；判决档为非思考模式（thinking=disabled），预算不会被思维链吃光
    max_tokens: 512
    anchor_edls: # 冻结锚点 EDL 集（与候选摘要做成对比较）
      - clips:
          - {shot_id: "anchor-a1", in_ms: 0, out_ms: 1500, transition: {type: cut, duration_ms: 0}}
          - {shot_id: "anchor-a2", in_ms: 0, out_ms: 2500, transition: {type: dissolve, duration_ms: 800}}
        audio: []
      - clips:
          - {shot_id: "anchor-b1", in_ms: 500, out_ms: 4000, transition: {type: cut, duration_ms: 0}}
          - {shot_id: "anchor-b2", in_ms: 0, out_ms: 3000, transition: {type: fade, duration_ms: 600}}
        audio:
          - {track_ref: "anchor-music", at_ms: 0, gain: 0.6}

# 分镜（storyboard）形态参数：探索预算、单轮分镜组数、镜头语法规则库（执行前校验
# 第③层与 rule.shot_grammar 门禁共用单一事实源）、轴规则、情绪基调向量表、
# 预演渲染价目与编码参数（单线程确定性档）、judge 提示词与锚点 ShotList 集
# 短剧差异：预算下调、单轮组数下调、**同景别连续镜头上限收紧**（节奏更快）、竖屏预演
storyboard:
  exploration_per_round_usd: 30 # 单轮预演渲染预算上限（按镜头数计价）
  boards_per_round: 2
  shot_grammar: # 镜头语法规则库：缺规则库即报错，不允许静默放过门禁
    shot_sizes: [extreme_close_up, close_up, medium, full, wide] # 景别档位枚举与序（由近及远）
    max_size_jump: 2 # 相邻镜头景别跳跃上限（档位序号差）
    max_same_size_run: 1 # 同景别连续镜头上限（短剧收紧为 1：节奏更快）
    camera_positions: [eye_level, low_angle, high_angle, over_shoulder, side] # 含侧机位
    movements: [static, pan, tilt, dolly, handheld] # 运动档位
  axis_rules: # 轴规则（执行前校验与 rule.axis_rule 共用；越轴需过渡镜头豁免）
    require_transition_on_cross: true # 侧别硬跳必须带过渡镜头
    allowed_transition_shots: 1 # 过渡镜头允许条数（越轴合法手法的豁免额度）
    side_field: side # 侧别字段名（ShotEntry.side ∈ A|B）
  alignment: # proxy.emotion_alignment 口径（读分镜卡帧像素：余弦 → 得分映射）
    cos_floor: 0.90 # 余弦下限：≤ 下限 → 0 分（对齐度阈值全配置化，原则五）
  emotion_vectors: # 情绪基调向量表（归一化 RGB 色板；对齐代理读分镜卡帧像素做余弦）
    calm: [0.30, 0.55, 0.45] # 平静（青绿）
    tense: [0.75, 0.18, 0.15] # 紧张（暗红）
    joyful: [0.90, 0.78, 0.20] # 欢快（暖黄）
    sorrow: [0.15, 0.25, 0.60] # 悲伤（冷蓝）
    awe: [0.55, 0.30, 0.80] # 敬畏（紫）
  render: # 预演渲染参数（编码单线程确定性档：同 ShotList 两次渲染逐字节一致）
    fps: 8
    width: 144 # 9:16 且可被 16 整除（避免 ffmpeg 改尺寸撞合规门禁）
    height: 256 # 竖屏 9:16 预演（试水档）
    codec: libx264
    encode_threads: 1 # 固定单线程档：消除 x264 多线程编码的非确定性
    price_per_shot_usd: 0.02 # 按镜头数计价；缺价目即报错（原则三）
    # 索引块网格（功能 018 / FR-015，契约 C8）：帧顶 R 行 × C 列块网格，容量 = 2**(R·C)。
    # 容量下界 = 该形态**派生镜头数**（`agents/pilot/scale.py` 的唯一公式）：短剧态
    # ceil(120 s ÷ 7.5 s) = 16 镜 ⇒ 容量 ≥ 4 位 ⇒ 此处 1×4 = 16 位容量恰够（无余量，如实登记）；
    # 量子上界（解码保真）2**C ≤ width ⇒ cols ≤ 7（2**4 = 16 ≤ 144 ✓）；又 1 ≤ rows ≤ height。
    # 缺项即报错；改网格取值 ⇒ 对齐代理评估器**即升版本**（原则一）。
    index_grid: {rows: 1, cols: 4}
  judge: # judge.script_fit 委员会：版本号 = 提示词 + 锚点集 + 摘要函数 + 输出预算四段哈希
    model: mock-copy-v1 # judge 走既有网关计费；缺价目网关即报错（不允许静默零成本）
    prompts:
      - "哪一版分镜的镜头语言更贴合剧本段落？"
      - "哪一版分镜的景别节奏更能传递剧本情绪？"
      - "哪一版分镜的轴线与机位安排更专业？"
    # judge 单票输出预算（缺即报错，不允许静默取码内默认）：判决输出只需一票（A/B/平局），
    # 512 足够；判决档为非思考模式（thinking=disabled），预算不会被思维链吃光
    max_tokens: 512
    anchor_shotlists: # 冻结锚点 ShotList 集（与候选摘要做成对比较）
      - schema_version: "1.0.0"
        shots:
          - {shot_id: shot-anchor-a1, scene_id: scene-1, covers: [s1-l1], shot_size: close_up, camera: eye_level, side: A, movement: static, est_duration_ms: 1000, alternatives: 2}
          - {shot_id: shot-anchor-a2, scene_id: scene-1, covers: [s1-l2], shot_size: medium, camera: low_angle, side: A, movement: dolly, est_duration_ms: 1500, alternatives: 3}
      - schema_version: "1.0.0"
        shots:
          - {shot_id: shot-anchor-b1, scene_id: scene-1, covers: [s1-l1, s1-l2], shot_size: wide, camera: high_angle, side: B, movement: pan, est_duration_ms: 2000, alternatives: 1}
          - {shot_id: shot-anchor-b2, scene_id: scene-1, covers: [s1-l3], shot_size: full, camera: over_shoulder, side: B, movement: static, est_duration_ms: 1000, alternatives: 4}

# 剧本（screenplay）形态参数：目标时长与页数容差、行-页换算、对白行占比区间、
# 节拍表（rule.beat_structure 与执行前校验共用单一事实源）、角色别名表、
# 升级判据阈值、生成与 judge 模型价目、judge 提示词与冻结锚点大纲集
# 短剧差异：**目标时长 2 分钟**（1~3 分钟档）、页数容差收紧、对白占比区间上调
# （短剧以对白推进剧情）、节拍表按短剧节奏裁剪（少而密）
screenplay:
  target_duration_min: 2 # 目标成片时长（rule.page_minutes 对照口径：1 页 ≈ 1 分钟）
  page_tolerance: 1 # 页数容差：总页数 ∈ [1, 3] 过 gate
  lines_per_page: 45 # 行 → 页换算口径（rule.page_minutes；缺即报错）
  dialogue_action_ratio: # 对白行占比区间（rule.dialogue_action_ratio 对照）
    min: 0.5 # 占比下限（对白行数 / 总行数；短剧对白密集）
    max: 0.9 # 占比上限（> 0.9 即比例失衡判 0）
  beat_sheet: # 节拍表（缺即报错；required=true 的节拍缺一即 rule.beat_structure 判 0）
    - {beat_id: opening_image, act: act1, required: true, description: "开场画面：3 秒内交代主角与其困境"}
    - {beat_id: inciting_incident, act: act1, required: true, description: "激励事件：扰动必须在前 20% 内出现"}
    - {beat_id: act1_turn, act: act1, required: true, description: "第一幕转折：主角无法回头"}
    - {beat_id: midpoint, act: act2, required: true, description: "中点：赌注升级，认知反转"}
    - {beat_id: act2_turn, act: act2, required: true, description: "第二幕转折：决意与计划"}
    - {beat_id: climax, act: act3, required: true, description: "高潮：正面对决与代价"}
    - {beat_id: resolution, act: act3, required: true, description: "结局：留钩子（下集预告感）"}
  character_aliases: # 角色别名表（缺即报错；同一写法禁多义——别名不得跨角色复用）
    林静: [阿静]
    陈默: [默哥]
    周医生: [] # 无别名角色（空列表合法）
  upgrade_criteria: # 升级判据阈值（缺任一项即报错，不允许静默"无判据"）
    judge_r_target: 0.6 # judge 信度达标线（与 010 人评锚点的相关系数 ≥ 该值）
    min_samples: 3 # 判据最小配对样本量（短剧单轮样本少，相应下调）
    drift_band: 0.1 # 漂移指标容忍带（|漂移| ≤ 该值视为带内）
    gate_violation_max: 0.2 # 门禁违规率上限（超限即不达标）
  model: mock-copy-v1 # 三阶段产出的生成模型（走既有网关；缺价目即报错，原则三）
  # 单次生成的最大输出 token（三段共用；缺即报错，不允许静默取码内默认）。
  # 为什么这么大：真实 LLM 单轮实测——接入的**推理模型**（思维链与正文共享输出预算），
  # `script` 阶段（最长产出）在 1024/4096 预算下都出现 finish_reason='length' +
  # reasoning_content 非空 + content=''（预算被思维链吃光，正文一字未出）。
  # 预算必须覆盖"思维链 + 正文"，故按最坏情况给足（预估成本上界随之保守上抬，见 loop._estimate_cost）。
  max_tokens: 16384
  model_prices: # 生成与 judge 共用的模型价目表（美元/千 token）
    mock-copy-v1: {prompt_per_1k: 0.001, completion_per_1k: 0.002}
    # DeepSeek 真实 LLM（OpenAI 兼容，base = https://api.deepseek.com）——冒烟用；
    # 口径：按**峰时（UTC 周一至周五 01:00-04:00 / 06:00-10:00）缓存未命中**上限折算，
    # 保守高估（真实账单因缓存命中与错峰计价只会更低，见 docs/二期升级路径-真实生成与投放.md）；
    # 价目/模型名变动由运维按官方价目与命名更新（旧名 deepseek-chat 等已退役）。
    # flash：输入 $0.3/1M → 0.0003/1k；输出 $1.2/1M → 0.0012/1k
    deepseek-flash: {prompt_per_1k: 0.0003, completion_per_1k: 0.0012}
    # pro：输入 $1.32/1M → 0.00132/1k；输出 $3.96/1M → 0.00396/1k
    deepseek-v4-pro: {prompt_per_1k: 0.00132, completion_per_1k: 0.00396}
  judge: # judge.dramatic_tension 委员会（仅 outline 阶段）：版本号 = 提示词 + 锚点集 + 摘要函数 + 输出预算四段哈希
    model: mock-copy-v1 # judge 走既有网关计费；缺价目网关即报错（不允许静默零成本）
    prompts:
      - "哪一份大纲的戏剧张力更强？"
      - "哪一份大纲的冲突升级更清楚？"
      - "哪一份大纲的人物动机更可信？"
    # judge 单票输出预算（缺即报错，不允许静默取码内默认）：判决输出只需一票（A/B/平局），
    # 512 足够；判决档为非思考模式（thinking=disabled），预算不会被思维链吃光
    max_tokens: 512
    anchor_outlines: # 冻结锚点大纲集（与候选大纲摘要成对比较；对照面不参与门禁）
      - schema_version: "1.0.0"
        stage: outline
        text: "锚点大纲 A：一名外科医生在术后发现病历被人改写，必须在真相与职位之间抉择。"
        beats:
          - {beat_id: opening_image, act: act1, required: true, description: "手术灯下主角的第一印象"}
          - {beat_id: act1_turn, act: act1, required: true, description: "被涂改的病历编号：他无法回头"}
          - {beat_id: climax, act: act3, required: true, description: "手术台前的公开对质"}
        scenes:
          - {scene_id: anchor-a1, heading: "内景 - 手术室 - 夜", location: 手术室, time_marker: 0, characters: [林静, 陈默], axis_base: A}
          - {scene_id: anchor-a2, heading: "内景 - 走廊 - 夜", location: 走廊, time_marker: 30, characters: [林静], axis_base: A}
        characters:
          - {name: 林静, aliases: [阿静]}
          - {name: 陈默, aliases: [默哥]}
        lines:
          - {line_id: a1-l1, scene_id: anchor-a1, kind: dialogue, character: 林静, text: "血压在掉，别停手。", key: false, emotion: tense}
          - {line_id: a1-l2, scene_id: anchor-a1, kind: action, character: 陈默, text: "陈默把手套按进器械盘，金属声很轻。", key: true, emotion: tense}
          - {line_id: a1-l3, scene_id: anchor-a2, kind: dialogue, character: 林静, text: "那份病历不是我签的字。", key: true, emotion: sorrow}
      - schema_version: "1.0.0"
        stage: outline
        text: "锚点大纲 B：一对夫妻在同一间病房里照顾临终的父亲，各自隐瞒了同一个决定。"
        beats:
          - {beat_id: opening_image, act: act1, required: true, description: "病房窗外落雪的第一印象"}
          - {beat_id: dark_night, act: act2, required: true, description: "病危通知递到手里"}
          - {beat_id: resolution, act: act3, required: true, description: "签字窗口前的沉默"}
        scenes:
          - {scene_id: anchor-b1, heading: "内景 - 病房 - 日", location: 病房, time_marker: 0, characters: [林静, 陈默], axis_base: B}
          - {scene_id: anchor-b2, heading: "外景 - 天台 - 夜", location: 天台, time_marker: 45, characters: [陈默], axis_base: B}
        characters:
          - {name: 林静, aliases: [阿静]}
          - {name: 陈默, aliases: [默哥]}
        lines:
          - {line_id: b1-l1, scene_id: anchor-b1, kind: dialogue, character: 陈默, text: "爸今天认得出我们吗？", key: false, emotion: sorrow}
          - {line_id: b1-l2, scene_id: anchor-b1, kind: action, character: 林静, text: "林静把保温杯拧开又拧上。", key: true, emotion: sorrow}
          - {line_id: b2-l1, scene_id: anchor-b2, kind: dialogue, character: 陈默, text: "字我签，你别管。", key: true, emotion: tense}

# 开发（选题 / IP 评估 / 立项组合）形态参数（功能 017）：短剧差异——方向更多、
# 组合更宽、热度分量更高、样本积累更快（min_samples 下调）、漂移带更宽。
dev:
  slate: {min: 5, max: 10} # 短剧试错快，一轮探索更多方向
  # "本轮进入生产"标记数区间：**恰好一条**（两形态同值）。七环节链一轮产出一部影片，
  # 而交接的取数入口（功能 018 / FR-005、契约 C5）要求组合内该标记恰好一条——上界留 2
  # 会让策略依 017 的判据区间标两条标记，链在短剧形态**直接拒绝启动**（真实矛盾，不是
  # 测试口径问题）。故该键不再是两形态的差异承载点：`dev` 段的形态差异由 `slate` 条目数
  # 区间、组合约束、信号参数与判据阈值承担（原则五：差异靠值，不靠删键）。
  production_marks: {min: 1, max: 1}
  combination:
    max_direction_repeat_rate: 0.5 # 短剧方向池更小，重复率上限放宽
  min_comparable_trees: 3 # 与电影同门槛（少样本不得出报告）
  signals:
    baseline_usd_million: 6.0 # 短剧单片票房量级更低
    sensitivity: 1.2 # 热度对票房的杠杆更陡
    buzz_baseline: 0.6 # 热度基线更高
  upgrade_criteria:
    correlation_target: 0.6 # 与电影同一北极星口径
    min_samples: 8 # 短剧周期短、样本积累更快
    drift_band: 0.15 # 短剧信号波动更大，容忍带放宽
    gate_violation_max: 0.3 # 同因放宽
  # 生成档：短剧方向多、单条论证更短（输出预算下调；缺项即报错，不取码内默认）
  model: mock-copy-v1
  model_prices:
    mock-copy-v1: {prompt_per_1k: 0.001, completion_per_1k: 0.002}
    deepseek-flash: {prompt_per_1k: 0.0003, completion_per_1k: 0.0012}
    deepseek-v4-pro: {prompt_per_1k: 0.00132, completion_per_1k: 0.00396}
  max_tokens: 4096 # 单条目立项论证的输出预算（短剧一轮方向更多、单条更短）

# 外环校准（功能 010 + 012）形态参数：盲评 top-k、最小样本量、偏差阈值、信度目标、
# 岭回归收缩强度、防自循环配对排除、judge 漂移自动检测口径
# 短剧差异：**外环日级**（period_days: 1 —— 短剧迭代快，按日校准）
calibration:
  period_days: 1 # 校准周期（天；日级外环）
  window_semantics: half_open # 窗口口径（取值域单元素；其它值装配报错）
  window_semantics_change_date: 2026-09-25 # 口径生效日（ISO 日期；跨该日的窗口比较必须标注）
  top_k: 3 # 每轮盲评清单锚点数（短剧预算小，盲评预算下调）
  min_samples: 3 # 偏差计算最小配对样本量，不足不产偏差值（FR-004）
  bias_threshold: 0.15 # 均值偏移超阈即生成权重再拟合提案
  reliability_target: 0.6 # 每周信度目标（Pearson r 达标口径）
  ridge_lambda: 1.0 # 约束岭回归向现权重收缩的强度
  self_pairing_exclusions: # 防自循环：平台真值锚点不与自身来源分量配对
    platform_truth: ["human.platform_metrics"]
  transfer: # 校准结论迁移（020 / C15）：**只迁结论、不迁权重**；可比性条件在此声明
    basis: conclusion_only # 取值域单元素：只迁结论（权重再拟合仍走 010 的提案 → 人工确认）
    source_forms: [shortdrama] # 允许的来源形态（短剧线）
    target_forms: [movie] # 允许的目标形态（回灌电影线作先验）
    conditions: # **键集 = 判定项清单**：缺一项即拒绝（不取码内默认）；判定实现单点在 core
      evaluator_registered: true # 目标形态须登记同 id 同 version 的评估器（版本冻结，原则一）
      min_samples: 30 # 来源周期样本量下限（样本不足 ⇒ 不可迁移）
      detector_version_match: true # 两形态判定口径一致（如漂移 detector_version；量纲差异须由换算口径承接）
      cadence_conversion: "日级来源按 ISO 周聚合后再与周级目标比较（显式换算口径）" # 空串 ⇒ 未声明 ⇒ 不可迁移
      real_coverage_days: 14 # 来源**真实**覆盖天数下限（只计 source=real；模拟回流不得迁移）
      reliability_floor: 0.6 # 来源信度下限（kendall_tau / pearson_r 取非空者）
      max_abs_mean_shift: 0.05 # 来源偏差幅度上限
      require_drift_pass: true # 来源漂移状态必须 pass（012 口径：verdict == normal）
    storage: {dir: transfers} # append-only 目录（相对 data_dir；与 proposals/ 并列）
    adoption: manual # 取值域单元素：人工两键（提案 → 人工采纳/搁置），无自动采纳路径
  drift: # judge 漂移自动检测（功能 012 F7）：滑动窗口基线 + PSI/分位数偏移双维判定
    window: 3 # 滑动窗口基线周期数（**单位 = cadence 同量纲**：日级 = 3 天、周级 = 3 周）
    buckets: 10 # 分桶数（[0,1] 等宽；须与 010 快照分桶数一致，缺/错即报错）
    psi_threshold: 0.2 # 分布距离（PSI）超阈线：> 该值判漂移（主指标）
    quantile_threshold: 0.1 # 分位数最大位移超阈线（辅指标，p25/p50/p75/p90）
    min_samples: 3 # 样本下限：低于该值即"样本不足"（不硬判）
    suspect_weight: 0.5 # suspect 的 judge 权重系数（分级处置降权）
    confirmed_exclude: true # confirmed_drift 是否排除出合成（true = 权重归零）
    scope_kinds: ["judge"] # 检测范围（evaluator_id 前缀）
    double_signal: # 双信号强化告警：漂移 ∧ 信度低于 target → 级别升级
      enabled: true
      reliability_target: 0.6 # 010 信度达标线（低于即视为"信度下降"信号）
      base_level: warning # 单信号告警级别
      escalated_level: critical # 双信号告警级别（必须与 base_level 不同）

# 做梦层（dreaming）形态参数：候选数、摘要窗口、奖励 λ、随机预算、塌缩检测
# 短剧差异：候选数与回放并行度下调（预算与机器占用同步收敛）
dreaming:
  candidates_per_round: 32 # 全量档 M（短剧候选预算下调）
  demo_candidates: 6 # 演示档 M（CI/演示用）
  recent_k: 5 # digest 读取最近 K 轮做梦落盘报告
  lambda: 0.5 # reward = pareto_auc − λ·parallel_penalty
  epsilon_random: 0.1 # 线上探索随机预算（宪章：树多样性）
  validation_top_ratio: 0.2 # validation 跌出前 20% 判过拟合
  collapse_window: 3 # 塌缩检测窗口（连续 N 轮）
  collapse_threshold: 0.7 # 塌缩阈值（首轮基线 × 0.7）
  replay_parallelism: 1 # 一期串行回放（预留并行配置项）
  # 禁止自动进化的 Agent 名单（宪章原则六）：命中即显式拒绝（非静默跳过）
  no_auto_evolve_agents: [screenplay, dev]

# 成本回归每日告警（宪章门禁：相同回放任务成本突增 >20% → 每日定时告警）
cost_regression:
  threshold: 0.2 # 成本增幅告警阈值（严格大于才告警）
  history_root: dreaming/history # 做梦轮次落盘根目录

# 前端可视化（功能 013）：只读视图（宪章 v1.1.0 原则五新条款）。
# 形态无关基建：短剧与电影共用同一只读视图（段值与 movie 逐字相同，不做形态特化）。
# 位置约定：本段放在 deployment 段**之前**——deployment 指针段按既有约定位于文件尾
# （core/yaml_edit.py 的定点补全不会穿越其后段）。
web:
  host: 127.0.0.1 # 默认仅回环（FR-011 保守部署：内部工具，不做公网暴露假设）
  port: 8080
  dsn_env: CINEFLOW_WEB_DSN # 只读角色 DSN 的环境变量名（口令不落盘）
  token: "" # 空 = 仅本机语义；非空则 /api/* 需 Authorization: Bearer 或 ?token=
  page_size: 50 # 单页容量上限（节点/树清单分页）
  data_dirs: # 文件化产物只读根目录（与既有 CLI/JSON 报告同源）
    policies: policies/history # 谱系 meta 与策略版本代码
    dreaming: dreaming/history # 做梦轮次报告（进化曲线）
    calibration: calibration # 010 信度报告 + 012 漂移状态与报表
    pools: replay/pools # 011 合并池构建快照（跨项目归属）
  export_dir: web/dist # 静态导出目录（同一查询层预生成 JSON + 资产拷贝）

# 试水链后端选择（功能 015 升级：A → B 一行切换）——**装配层的唯一开关**。
# 段缺失即取默认（backend=simulated / llm_backend=mock）：A 路径零配置可跑；
# 声明 http 而凭证缺失 = 装配期显式拒绝（不静默回落模拟、不落树、不扣费）。
# 取值非法（未知环节名/未知取值）同样在装配期拒绝。逐环节覆盖写在 overrides。
# LLM 模型档案与角色路由（功能 016）：**端点与价目只在本配置里**——码内不内置任何厂商
# 价目（价目内置即历史成本不可复现，宪章原则一）；档案集合随 config_snapshot["llm_profiles"]
# 冻结，改价只影响新节点。roles 为单层映射（角色 → 档案 id）；角色枚举固定四个
# （generation/judge/dreaming_candidates/copywriting，见 core/llm_gateway/routing.py 的调用点盘点）。
llm:
  profiles:
    deepseek-flash: # 云端厂商（OpenAI 兼容）：**生成档**——思考模式（质量优先）
      model: deepseek-flash # 厂商模型名（档案 id 只是本仓路由键；曾误把 id 当模型名发出被 400 拒）
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY # 中立厂商名（端点/密钥按档案声明读取；环境里其它变量不参与判定）
      legacy_env: false
      prices: {prompt_per_1k: 0.0003, completion_per_1k: 0.0012}
      price_note: "峰时缓存未命中上限（保守高估；缓存命中与错峰更低；记账 ≠ 厂商账单）"
      # 单请求超时：推理模型的思维链+正文常超过默认 30s（实测 30s 即 timeout），故放宽
      timeout_seconds: 120
      # 请求参数（白名单 thinking/reasoning_effort）：**生成档用思考模式**（质量优先；
      # 厂商默认即 enabled+effort=high，显式声明以便审计与快照冻结）
      request_options: {thinking: {type: enabled}, reasoning_effort: high}
    deepseek-flash-fast: # **判决档**：同模型非思考模式（速度/成本优先；判决只要一票）
      model: deepseek-flash # 与生成档**同模型**（差异只在 request_options）
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      legacy_env: false
      prices: {prompt_per_1k: 0.0003, completion_per_1k: 0.0012} # 同模型同价（与生成档一致）
      price_note: "同 deepseek-flash（峰时缓存未命中上限，保守高估）"
      timeout_seconds: 60 # 非思考模式：无思维链，响应快
      request_options: {thinking: {type: disabled}}
    local-qwen: # 本地/自建示例：零边际成本（仍非免费：机器/电/运维成本不在本表）
      model: local-qwen # 示例：自建服务上的模型 id（按部署实际填写）
      base_url_env: LOCAL_LLM_BASE_URL
      api_key_env: LOCAL_LLM_API_KEY
      prices: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
      zero_marginal: true
      price_note: "自建推理：零边际成本（机器/电/运维成本不在本表）"
      timeout_seconds: 60 # 本地推理：单请求超时（按部署规模可调）
  roles: # 角色 → 档案（单层；未映射的枚举内角色回落 default_profile）
    generation: deepseek-flash # 剧本正文：质量优先 → 思考模式
    judge: deepseek-flash-fast # 判决：只要一票 → 非思考模式（思维链不再吃光预算）
    copywriting: deepseek-flash-fast # 宣发文案：短文本，非思考模式够用
    dreaming_candidates: deepseek-flash-fast # 策略代码生成：先非思考，质量不足再调（改本行即可）
  default_profile: deepseek-flash # 多档案必须显式声明（单档案才可省略并自动认定）

# 真实渠道与账单对账（功能 019）：预算门禁 / 账单导入面 / 逐项对账 / 校准先决 / 连续运行证据。
# **渠道 id、环节 id 与账单格式 id 只在本段声明**（`core/billing/` 零渠道/环节/格式字面量、
# 零分支）；缺任一键即装配期报错（不取码内默认，FR-001/FR-014）。
# **额度取值为最小规模档且"未标定"**：具体数字由运营给定（规格开放问题 1）——未标定期间
# 按最小规模运行并如实标注；运营给定后**只改本段**（机制面一行不动）。
# **两形态取值不同**（与电影态的差异逐项落在本段，见 T1923）：短剧额度更小、时间窗更短
# （投放节奏密集 → 单条物料数天内见效/失效，周校准粒度太粗）。
budget:
  channels: # 渠道登记（本形态登记 LLM 渠道 + **C 路径投放渠道**；生成侧渠道结转 G2）
    llm:
      adapter: pilot_llm # 真实调用面的装配入口（链内唯一装配点 + 校准入口，见 agents/pilot/backends.py）
      bill: # 账单导入面：格式 id + 来源形态 + 列映射（**列映射驱动分类**，缺声明即导入报错）
        format: csv_lines # 内置通用格式键（`core/billing/` 内唯一允许出现的格式字面量）
        fetch: export # export|api：导出导入为本特性的来源形态（本特性不实现联网拉取）
        columns: # 语义字段 → 账单列名；entry_id/amount/currency/period/line_kind/amount_sign 必填
          entry_id: entry_id
          amount: amount
          currency: currency
          period: period
          line_kind: line_kind
          amount_sign: amount_sign
          # 档案 id 列：对账按**（档案 id, 周期）**逐项配对（网关账目与账单两侧同一维度）；可空
          model_ref: model_ref
          # 异币种**条件必填**（账单币种 ≠ 记账币种时缺任一即导入报错，不猜汇率）
          fx_rate: fx_rate
          fx_source: fx_source
          fx_at: fx_at
        classification: # 分类驱动列的取值域（C13：分类输入面由配置声明，不用金额阈值或符号启发式）
          line_kind: # 账单 line_kind 取值 → 固定六类之一；**映射不到的取值 ⇒ 未分类 ⇒ 告警**
            usage: 计费口径
            unbilled: 未入账
            timing_shift: 时序错位
            discount: 免费额度与折扣
            free_quota: 免费额度与折扣
            fx_adjustment: 币种汇率
            unsettled: 未结账
          amount_sign: # 账单 amount_sign 取值 → 金额符号（+1 记账 / -1 冲减）
            charge: 1.0
            credit: -1.0
      tiers: # 按渠道分组的档位命名空间：**键 = 环节 id = 各 .chat( 调用点声明的 stage= 取值**
             # （不发明 agent 名 ↔ 环节 id 映射）；同一档位不得跨渠道串用
        screenplay: # 剧本正文三阶段生成（agents/screenplay/loop.py）
          limit_usd: 2.0 # 上限（> 0）；**未标定**：运营给定前按最小规模档运行
          window: {kind: day} # run|day|period；短剧按**日**结算（比电影态的账单周期更短）
          on_exhausted: refuse # 唯一取值：拒绝（不排队、不降级为模拟）
          note: "未标定（剧本生成最小规模档）：运营给定后只改本值；估算额/网关记账/厂商账单三数分离"
        dev: # 立项组合逐条目论证生成（agents/dev/loop.py）
          limit_usd: 1.0 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: day}
          on_exhausted: refuse
          note: "未标定（立项论证最小规模档）：运营给定后只改本值"
        promo: # 宣发文案生成（agents/promo/material.py）
          limit_usd: 0.5 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: run}
          on_exhausted: refuse
          note: "未标定（宣发文案最小规模档）：单轮物料数即单轮调用数，运营给定后只改本值"
        screenplay_judge: # 剧本 judge 委员会（agents/screenplay/evaluators/dramatic_tension.py）
          limit_usd: 0.8 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: run}
          on_exhausted: refuse
          note: "未标定（剧本判官最小规模档）：票数 × 锚点数即单轮调用数，运营给定后只改本值"
        storyboard_judge: # 分镜 judge 委员会（agents/storyboard/evaluators/script_fit.py）
          limit_usd: 0.8 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: run}
          on_exhausted: refuse
          note: "未标定（分镜判官最小规模档）：运营给定后只改本值"
        visual_judge: # 视觉 judge 委员会（agents/visual/evaluators/cinematic.py）
          limit_usd: 0.8 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: run}
          on_exhausted: refuse
          note: "未标定（视觉判官最小规模档）：运营给定后只改本值"
        editing_judge: # 剪辑 judge 委员会（agents/editing/evaluators/narrative.py）
          limit_usd: 0.8 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: run}
          on_exhausted: refuse
          note: "未标定（剪辑判官最小规模档）：运营给定后只改本值"
        dreaming_candidates: # 做梦层候选策略生成（dreaming/candidates.py）
          limit_usd: 0.5 # 上限（> 0）；**未标定**（同最小规模档口径）
          window: {kind: run}
          on_exhausted: refuse
          note: "未标定（做梦候选最小规模档）：运营给定后只改本值"

    media: # C 路径投放渠道（**只登记在短剧态**：投放属短剧线 C 路径，电影态不登记）
      adapter: promo_platform # **权威定名**：投放渠道的 adapter 取值（真实调用面的装配入口）
      bill: # 投放平台账单导入面（复用 019 的导入与对账，**不新造第二套**）
        format: csv_lines # 内置通用格式键（平台侧导出格式未标定前沿用通用列映射）
        fetch: export # export|api：导出导入为本特性的来源形态（本特性不实现联网拉取）
        columns: # 语义字段 → 账单列名（列名待运营按平台导出给定；未标定期间沿用通用语义列）
          entry_id: entry_id
          amount: amount
          currency: currency
          period: period
          line_kind: line_kind
          amount_sign: amount_sign
          model_ref: model_ref
          fx_rate: fx_rate
          fx_source: fx_source
          fx_at: fx_at
        classification: # 分类驱动列取值域（与 LLM 渠道同一口径：分类输入面由配置声明）
          line_kind:
            usage: 计费口径
            unbilled: 未入账
            timing_shift: 时序错位
            discount: 免费额度与折扣
            free_quota: 免费额度与折扣
            fx_adjustment: 币种汇率
            unsettled: 未结账
          amount_sign:
            charge: 1.0
            credit: -1.0
      tiers: # 投放环节档（键 = 投放环节 id = 投放调用声明的 stage=；**恰好一个**）
        promo_launch: # 投放最小规模档：运营给定前按本档运行（**未标定**）
          limit_usd: 0.5 # 上限（> 0）；取本形态最小规模量级；运营给定后只改本值
          window: {kind: day} # run|day|period；投放按日结算
          on_exhausted: refuse # 唯一取值：拒绝（不排队、不降级为模拟）
          note: "未标定（投放最小规模档）：运营给定后只改本值；扩量走 raise-tier 且须引用合格校准记录"
  peak_windows: # 峰谷时段：**渠道日历的唯一来源**（峰谷判定 + 额度 day 窗口 + 运行记录日期共用）
    timezone: Asia/Shanghai # 必填（缺即装配报错）；不引入第二个时区配置键
    attribution: call_start # 取值域单元素：按**调用开始时刻**归属（跨峰谷切换不拆分）
    windows: [{start: "08:30", end: "00:30"}] # 峰时区间，闭开 [start, end)，支持跨夜；不需峰谷定价的渠道写 []
  calibration: # 最小规模校准记录（扩量的先决条件）
    min_samples: 5 # 样本量下限（短剧单笔小额、噪声大，故下限高于电影态的 3）
    deviation_tolerance: 0.1 # 实测偏差容差 |deviation| ≤ 0.1
    record_ttl_days: 14 # 记录有效期（投放节奏密集 ⇒ 过期更快；超期 ⇒ stale，扩量恒拒绝）
  reconcile: # 账单对账阈值（单笔量级更小 ⇒ 容差与告警阈值按比例收紧）
    amount_tolerance_usd: 0.001 # |delta| ≤ 容差视为零差异（**仍须分类与口径备注**）
    alert_threshold_usd: 0.1 # 超阈值 ⇒ delta_over_threshold 告警
    unexplained_alert: true # 存在未分类/未解释项 ⇒ 告警（为真时**不得**关闭该行为）
  ledger: # 跨进程账本（单主机文件账本：flock + 原子替换 + 单调 revision）
    root: billing # 产物根（相对仓库根；绝对路径原样使用）
    lock_timeout_seconds: 5.0 # 锁超时 ⇒ 拒绝调用（不无锁写、不静默放行）
  runs: # 运行记录窗口机检（覆盖 + 连续双条件）
    min_window_days: 14 # 覆盖下限（= 立项书 G4 验收原文"短剧线真实数据回流 ≥2 周"，**不是发明数字**）
    gap_tolerance_days: 0 # 断档容差（0 = 不容断档；缺口如实列出、不插值）

pilot:
  backend: simulated # simulated | http：五个环节的平台适配器（分镜/视觉/声音/剪辑/宣发）
  llm_backend: mock # mock | http：LLM 网关后端（http 读 OPENAI_BASE_URL / OPENAI_API_KEY）
  overrides: {} # 逐环节覆盖（优先于全局取值），如 {visual: http, llm: http}
  # 体量档（功能 018 / FR-014）：`scene_count` 与 `lines_per_scene` 是体量的**唯一来源**
  # （唯一解析者是 `agents/pilot/pilot.py` 的 PilotConfig；`agents/*/config.py` 不读本段）。
  # 缺项即报错（不取码内默认）；页数门禁 = 场景数 × 每场景行数 ÷ lines_per_page。
  scene_count: 4 # 短剧试水体量：四场景（未标定）
  lines_per_scene: 12 # 每场景行数（未标定；页数 = 4 × 12 ÷ 45 ≈ 1.07 页）
  # 排练档（FR-013 / 契约 C10）：缩档只改本段，链路拓扑/交接契约/门禁/评估器组合一行不动。
  rehearsal:
    status: declared # declared | unstandardized
    work_kind: rehearsal # rehearsal | real_work
    scale: # 短剧形态原值即其 1~3 分钟档（各键与形态原值同值：无缩减，如实标注"未标定"）
      target_duration_s: 120.0 # 秒级浮点：覆盖 editing.target_duration_s；**未标定**
      script_target_minutes: 2.0 # 浮点分钟（0.5 合法）：覆盖 screenplay.target_duration_min
      script_tolerance_minutes: 1.0 # 浮点分钟：覆盖 screenplay.page_tolerance
      clip_duration_seconds: 7.5 # 覆盖 visual.clip_spec.duration_seconds
  # 性能门禁阈值（FR-010 / 契约 C13）：status=declared 时七环节逐键齐备且值为正；
  # 未标定期间**不发明数字**、不产出达标结论。
  performance:
    status: unstandardized # declared | unstandardized（阈值数字属运营侧输入）
    stage_seconds: {} # 键 = 七环节 id（dev/script/storyboard/visual/sound/editing/promo）

# 部署指针（功能 009）：剧本 Agent 的当前部署策略版本——**仅人工采纳后更新**
# （值 = policies/history/screenplay/ 下的策略版本）。部署自动化（功能 014）：
# 模式状态机 + 证据门槛（三要件）+ 影子期下限 + 渐进抽检策略。
# 短剧与电影共用同一 Agent 策略谱系与部署门禁（形态差异不改门禁强弱）。
# 位置约定：新增键写在 deployment 段**内**、指针子段（screenplay:）**之前**。
deployment:
  mode_default: manual # 部署模式默认值（manual/shadow/auto；宪章：默认全人工）
  gate: # 证据门槛（宪章原则六三要件；缺证据即拦截，宁可拦截）
    validation_top_ratio: 0.2 # validation 排名不跌出前 20%（005 口径，逐字同款 cutoff）
    require_unbiasedness: true # 无偏性验收为前置（未通过 → 整体证据不足）
    allow_without_judge: false # 无 judge 层的 Agent 默认保守（not_applicable 不构成满足）
  shadow: # 影子期硬门禁（立项书：影子模式 ≥2 周；未满禁开 auto）
    min_days: 14 # 影子期累计时长下限（天；按模式区间累计）
    min_candidates: 20 # 影子期覆盖候选数下限
  spot_check: # 人工事后抽检（渐进：前 N 次全量复核，之后按比例）
    first_n: 5 # 前 N 次自动部署全量复核
    ratio: 0.2 # 之后按比例抽检（1/5）
    # 待复核超期告警阈值（天）：短剧**投放节奏密集**（单条物料数天内就见效/失效），
    # 复核窗口比电影缩短到 2 天——超期只告警，结论仍只能由人签署（不自动视为通过）
    pending_alert_days: 2
  # 开发 Agent 部署指针（功能 017）：当前部署的人工策略版本——**仅人工采纳后更新**
  # （未采纳更新指针次数恒 0，SC-002 机检；值 = policies/history/dev/ 下的策略版本；
  #  初始值 = 人工策略首版（谱系根 policies/history/dev/34525518074d.meta.json）。
  #  位置：写在 screenplay 子段**之前**——指针子段（screenplay:）须保持为 deployment 段
  #  末个条目，挪动会改变定点改写的插入位点）
  dev:
    current_policy_version: 34525518074d
  screenplay:
    current_policy_version: fa6b7bca77ed

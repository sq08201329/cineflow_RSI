# 形态配置：电影（movie）
# 形态即配置：评估器组合与权重在此表达，切换形态零代码改动（宪章原则五）。
# 参照 docs/CineFlow开发文档.md §7 示例；本特性仅落地 evaluator_weights 骨架，供 US3 读取。
form: movie

evaluator_weights:
  visual:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0
    rule.format_compliance: gate
    proxy.aesthetic: 0.25
    proxy.identity_consistency: 0.35
    proxy.flicker: 0.15
    judge.cinematic: 0.25

# 回放形态参数（功能 002）：worker_count 为虚拟时钟并行工作者数 W；
# latency_quantum_ms 为响应时间填充的时延量子（计时侧信道防护）；
# unbiasedness_tau_threshold 为回放无偏性 Kendall τ 发布门槛
replay:
  worker_count: 4
  latency_quantum_ms: 50
  validation_split: latest_tree
  unbiasedness_tau_threshold: 0.95

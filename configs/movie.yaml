# 形态配置：电影（movie）
# 形态即配置：评估器组合与权重在此表达，切换形态零代码改动（宪章原则五）。
# 参照 docs/CineFlow开发文档.md §7 示例；本特性仅落地 evaluator_weights 骨架，供 US3 读取。
form: movie

evaluator_weights:
  visual:
    # gate 表示硬规则门禁：score 为 0 时总分直接为 0
    rule.format_compliance: gate
    proxy.aesthetic: 0.25
    proxy.identity_consistency: 0.35
    proxy.flicker: 0.15
    judge.cinematic: 0.25
  promo:
    rule.material_compliance: gate
    proxy.ctr_history: 0.4
    human.platform_metrics: 0.6

# 回放形态参数（功能 002）：worker_count 为虚拟时钟并行工作者数 W；
# latency_quantum_ms 为响应时间填充的时延量子（计时侧信道防护）；
# unbiasedness_tau_threshold 为回放无偏性 Kendall τ 发布门槛
replay:
  worker_count: 4
  latency_quantum_ms: 50
  validation_split: latest_tree
  unbiasedness_tau_threshold: 0.95

# 宣发（promo）形态参数：预算门禁、物料规格、敏感词库、模型价目表、模拟平台分布
promo:
  exploration_per_round_usd: 500
  promo_pilot_ratio: 0.02 # 单轮 ≤ 总预算 2%（预算门禁，FR-002）
  default_model: mock-copy-v1
  materials_per_round: 4
  material_spec:
    max_copy_chars: 120
    poster_size: "1080x1920"
    max_duration_seconds: 30
  sensitive_words: ["最", "第一", "国家级"] # 示例敏感词库；缺配置即拒投不放行
  ctr_prior: {alpha: 2.0, beta: 40.0} # 分桶贝塔平滑先验强度
  ctr_cap: 0.2 # CTR 归一化上限（score = min(1, ctr / cap)）
  metric_weights: {ctr: 0.5, completion_rate: 0.3, conversions: 0.2} # 真值归一化合成
  model_prices: # 模型价目表（美元/千 token）；缺价目即报错，不允许静默零成本
    mock-copy-v1: {prompt_per_1k: 0.001, completion_per_1k: 0.002}
  simulated_platform: # 模拟平台分布参数（Beta 先验）
    base_impressions: 1000
    ctr_beta: [2.0, 40.0]
    completion_beta: [3.0, 7.0]

# 视觉（visual）形态参数：片段规格、生成预算、帧采样规则、judge 锚点集与提示词
visual:
  exploration_per_round_usd: 500 # 单轮生成预算上限（FR-003，预算门禁）
  clips_per_round: 3
  clip_spec: # 片段规格（rule.format_compliance 对照）
    width: 320
    height: 240
    fps: 8
    duration_seconds: 2.0
    codec: h264
  frame_sampling: # 帧采样规则（进评估器版本元信息，决策 3）
    count: 8
    size: 64
  simulated_gen: # 确定性模拟生成器参数（决策 2）
    frames: 16
    estimated_cost_usd: 0.6 # 预估花费（实际扣费 ≤ 预估）
    cost_per_clip_usd: 0.5 # 实际扣费
  judge: # judge.cinematic 委员会（决策 5）：锚点=固定生成参数集经模拟生成器产出
    anchor_gen_params:
      - {style: "史诗", shots: 2, seed_tier: 1}
      - {style: "纪实", shots: 1, seed_tier: 2}
    prompts:
      - "哪一段镜头的电影感更强？"
      - "哪一段的叙事张力更好？"
      - "哪一段的画面构图更专业？"

# 外环周校准（功能 010）形态参数：盲评 top-k、最小样本量、偏差阈值、信度目标、
# 岭回归收缩强度 λ_ridge、防自循环配对排除（锚点来源 → 剔除的评估器分量键）
calibration:
  period_days: 7 # 校准周期（天）
  top_k: 5 # 每轮盲评清单锚点数（稀疏人评预算）
  min_samples: 3 # 偏差计算最小配对样本量，不足不产偏差值（FR-004）
  bias_threshold: 0.15 # 均值偏移超阈即生成权重再拟合提案
  reliability_target: 0.6 # 每周信度目标（Pearson r 达标口径）
  ridge_lambda: 1.0 # 约束岭回归向现权重收缩的强度
  self_pairing_exclusions: # 防自循环：平台真值锚点不与自身来源分量配对
    platform_truth: ["human.platform_metrics"]

# 做梦层（dreaming）形态参数：候选数、摘要窗口、奖励 λ、随机预算、塌缩检测
dreaming:
  candidates_per_round: 128 # 全量档 M
  demo_candidates: 8 # 演示档 M（CI/演示用，决策 7 串行回放预算内）
  recent_k: 5 # digest 读取最近 K 轮做梦落盘报告
  lambda: 0.5 # reward = pareto_auc − λ·parallel_penalty
  epsilon_random: 0.1 # 线上探索随机预算（宪章：树多样性）
  validation_top_ratio: 0.2 # validation 跌出前 20% 判过拟合
  collapse_window: 3 # 塌缩检测窗口（连续 N 轮）
  collapse_threshold: 0.7 # 塌缩阈值（首轮基线 × 0.7）
  replay_parallelism: 1 # 一期串行回放（预留并行配置项）

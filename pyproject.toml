[project]
name = "cineflow"
version = "0.1.0"
description = "CineFlow 影视 Agents 自我进化生产系统（L1 基建：发现树与评估器框架）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "boto3>=1.34",
    "blake3>=0.3",
    "uuid-utils>=0.8",
    "pyyaml>=6.0",
    "numpy>=2.4.6",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv]
# 内部库项目：不打 wheel，仅以源码方式运行
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要 Docker 化 PostgreSQL/MinIO 的集成测试（本地无 Docker 时自动跳过）",
    "adversarial: 对抗测试套件（合并阻塞门禁，需 Docker；无 Docker 报错而非跳过）",
    "unbiasedness: 无偏性验收测试（发布阻塞门禁）",
]

[tool.coverage.run]
# web/ 为宪章唯一目录例外（只读前端）：其接口层同口径计入覆盖率（功能 013 T1322）
source = ["core", "agents", "dreaming", "web"]

[tool.ruff]
target-version = "py311"
# 版本化策略文件（文件名=内容哈希）与做梦轮次落盘不得被格式化/检查改写
# 文档与规格目录不参与 lint/format（规格是设计记录，且新版 ruff 会重排 md 代码块）
extend-exclude = ["policies/history", "dreaming/history", "docs", "specs", ".specify", ".kimi-code"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

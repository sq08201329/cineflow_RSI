[project]
name = "cineflow"
version = "0.1.0"
description = "CineFlow 影视 Agents 自我进化生产系统（L1 基建：发现树与评估器框架）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "boto3>=1.34",
    "blake3>=0.3",
    "uuid-utils>=0.8",
    "pyyaml>=6.0",
]

[tool.uv]
# 内部库项目：不打 wheel，仅以源码方式运行
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要 Docker 化 PostgreSQL/MinIO 的集成测试（本地无 Docker 时自动跳过）",
    "adversarial: 对抗测试套件（合并阻塞门禁，需 Docker；无 Docker 报错而非跳过）",
    "unbiasedness: 无偏性验收测试（发布阻塞门禁）",
]

[tool.coverage.run]
source = ["core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

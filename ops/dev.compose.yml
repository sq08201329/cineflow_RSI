# 本地开发依赖：PostgreSQL 16（谱系元数据）+ MinIO（S3 兼容工件存储）
# 用法（--wait 只用于长驻服务；minio-init 是一次性服务，退出会让 --wait 判失败）：
#   docker compose -f ops/dev.compose.yml up -d --wait postgres minio
#   docker compose -f ops/dev.compose.yml up minio-init      # 建工件 bucket
# 全量启动（不等就绪）：docker compose -f ops/dev.compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cineflow
      POSTGRES_PASSWORD: cineflow
      POSTGRES_DB: cineflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineflow -d cineflow"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cineflow
      MINIO_ROOT_PASSWORD: cineflow123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - miniodata:/data

  # 一次性初始化：创建工件 bucket（内容寻址，key 即 BLAKE3 哈希）
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cineflow cineflow123;
      mc mb --ignore-existing local/cineflow-artifacts;
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:

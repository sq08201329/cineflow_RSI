# CI：单元测试覆盖率门禁（≥85%，宪章里程碑门禁）+ 集成测试（PG/MinIO）
name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - name: 安装依赖（Python 3.11 由 .python-version 锁定）
        run: uv sync
      - name: ruff 检查（锁定版本，全仓库含 agents/dreaming）
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 单元测试 + 覆盖率门禁（core + agents + dreaming ≥85%）
        run: >-
          uv run pytest tests/unit --cov=core --cov=agents --cov=dreaming
          --cov-report=term-missing --cov-fail-under=85

  # 适配器契约套件（SC-007）：模拟实现全过，真实实现无凭证按用例跳过
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - run: uv sync
      - name: 平台适配器契约套件（双实现同跑）
        run: uv run pytest tests/contract

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - run: uv sync
      - name: 起开发依赖（PostgreSQL 16 + MinIO）
        run: |
          # 只对长驻服务用 --wait；minio-init 是一次性服务，退出会让 --wait 判失败
          docker compose -f ops/dev.compose.yml up -d --wait postgres minio
          docker compose -f ops/dev.compose.yml up minio-init
      - name: 执行 Alembic 迁移（含 immutable 触发器与应用账号 REVOKE）
        run: uv run alembic -c ops/alembic.ini upgrade head
        env:
          CINEFLOW_PG_DSN: postgresql+psycopg://cineflow:cineflow@localhost:5432/cineflow
      - name: 集成测试（immutable 双保险 / jsonb / 三维索引 / 3 万节点基准）
        run: uv run pytest tests/integration -m integration
        env:
          CINEFLOW_PG_TEST_DSN: postgresql+psycopg://cineflow:cineflow@localhost:5432/cineflow
      - name: 清理
        if: always()
        run: docker compose -f ops/dev.compose.yml down -v

  # 对抗测试（合并阻塞门禁）：CI 以 gVisor 后端为权威——装 runsc 并注册
  # docker runtime；装配探测失败即 CI 失败，不允许降级到加固容器
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - run: uv sync
      - name: 安装 gVisor runsc 并注册为 docker runtime
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
      - name: gVisor 后端必须可用（否则 CI 失败而非降级）
        run: |
          docker info --format '{{json .Runtimes}}' | grep -q runsc
          uv run python -c "from core.sandbox.backends.docker_gvisor import DockerGVisorBackend; assert DockerGVisorBackend().available(), 'runsc 不可用'"
      - name: 对抗测试套件（三件套作弊策略全拦截）
        run: uv run pytest tests/adversarial -m adversarial

  # 无偏性验收（发布阻塞门禁）：一致轨迹放行、注入偏差 100% 拒绝
  unbiasedness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - run: uv sync
      - name: 无偏性验收套件
        run: uv run pytest tests/unbiasedness -m unbiasedness

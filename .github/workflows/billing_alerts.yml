# 预算与账单差异告警门禁（019 / 契约 C14；三期立项书 §4 新增门禁）
# 形态对齐一期 cost-regression：脚本非零退出即 CI 失败=告警（0 无告警 / 1 有告警 / 2 用法或配置错误）。
# **只读既有产物**：`billing/{channel}/reports/*.json` 的未解释项与超阈值告警 + `alerts.jsonl` 留痕
# —— 零真实调用、零凭证、零外部网络；报告尚未产出（冷启动）时放行（has_alerts=false）。
# 判定逻辑全在 core（`ReconciliationReport.has_alerts()`），工作流只跑薄 CLI。
name: billing-alerts

on:
  schedule:
    # 每日 UTC 02:47（错峰：避开整点与 cost-regression 的 02:23），约北京时间 10:47
    - cron: "47 2 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  billing-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - run: uv sync
      - name: 预算与账单差异告警检查（未解释项/超阈值 ⇒ 非零退出告警）
        run: uv run python ops/billing.py alert-check --channel llm --config configs/movie.yaml
